<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design system · Cannelle</title>
<link rel="stylesheet" href="styles.css">
<style>
  *{box-sizing:border-box}
  html{scroll-padding-top:72px}
  body{margin:0;background:var(--bg);color:var(--text);font:var(--type-body);-webkit-font-smoothing:antialiased}
  a{color:var(--text-link);text-decoration:none}
  a:hover{color:var(--text-link-hover)}

  .page{max-width:820px;margin:0 auto;padding:40px var(--gutter-screen) 96px;padding-left:max(var(--gutter-screen),env(safe-area-inset-left));padding-right:max(var(--gutter-screen),env(safe-area-inset-right))}

  header{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-11)}
  .eyebrow{font-size:var(--size-eyebrow);font-weight:var(--weight-bold);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text2)}
  h1{font:var(--type-screen-title);margin:0;font-size:34px}
  .lead{color:var(--text2);margin:0;max-width:58ch;text-wrap:pretty}

  nav{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 calc(-1 * var(--gutter-screen));padding:var(--space-4) var(--gutter-screen);border-bottom:var(--hairline)}
  nav ul{list-style:none;margin:0;padding:0;display:flex;gap:var(--gap-chips);overflow-x:auto;scrollbar-width:none}
  nav ul::-webkit-scrollbar{display:none}
  nav a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--radius-pill);background:var(--surface2);color:var(--text);font-size:var(--size-label);font-weight:var(--weight-semibold);white-space:nowrap;transition:background var(--duration-base) var(--ease-standard),color var(--duration-base) var(--ease-standard)}
  nav a:hover{background:var(--primary-light);color:var(--text)}
  nav a.on{background:var(--primary-dark);color:var(--text-on-primary)}
  nav a i{font-size:16px}

  section{padding-top:var(--space-16)}
  .sec-head{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-7)}
  h2{font:var(--type-section-title);margin:0;display:flex;align-items:center;gap:var(--space-3)}
  h2 i{font-size:20px;color:var(--primary-dark)}
  .sec-head p{margin:0;color:var(--text2);font-size:var(--size-caption);text-wrap:pretty}

  .cards{display:flex;flex-direction:column;gap:var(--space-7)}
  .card{background:var(--surface);border:var(--hairline);border-radius:var(--radius-card);overflow:hidden}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-5);padding:14px 16px;border-bottom:var(--hairline)}
  .card-head h3{margin:0;font:var(--type-caption);font-weight:var(--weight-bold);color:var(--text)}
  .card-head p{margin:2px 0 0;font-size:var(--size-meta);color:var(--text2)}
  .open{flex:none;display:inline-flex;align-items:center;justify-content:center;width:var(--tap-min);height:var(--tap-min);margin:-10px -10px -10px 0;border-radius:var(--radius-round);color:var(--text3);font-size:18px;transition:color var(--duration-fast) var(--ease-standard),background var(--duration-fast) var(--ease-standard)}
  .open:hover{color:var(--primary-dark);background:var(--primary-light)}
  .frame{position:relative;overflow:hidden;background:var(--bg)}
  .frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:var(--bg)}

  .app-wrap{display:flex;justify-content:center;padding:var(--space-11) var(--space-7);background:var(--surface2)}
  .app-wrap .frame{border-radius:var(--radius-card);border:var(--hairline);width:100%;max-width:430px}

  .note{margin-top:var(--space-7);padding:var(--space-7) var(--pad-card);border-radius:var(--radius-card);background:var(--secondary-light);color:var(--text);font-size:var(--size-caption);text-wrap:pretty}
  .note strong{font-weight:var(--weight-bold)}

  footer{margin-top:var(--space-16);color:var(--text3);font-size:var(--size-meta)}
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="eyebrow">Référence · Cannelle</span>
    <h1>Design system</h1>
    <p class="lead">Couleurs, typo, espacements et composants de l'app, rendus tels quels. Les règles complètes sont dans <a href="readme.md">readme.md</a>, les valeurs exactes dans <a href="tokens/colors.css">tokens/</a>.</p>
  </header>

  <nav aria-label="Sections">
    <ul id="nav"></ul>
  </nav>

  <main id="main"></main>

  <footer>Chaque fiche s'ouvre seule avec l'icône en haut à droite.</footer>
</div>

<script>
const SECTIONS = [
  { id:'couleurs', icon:'palette', title:'Couleurs', intro:'Fond crème, deux couleurs de marque, cinq teintes catégorie.', cards:[
    ['guidelines/colors-neutrals.card.html',700,150,'Neutres & surfaces','Fond crème, surface blanche, surface creuse'],
    ['guidelines/colors-primary.card.html',700,150,'Primary · vert olive','Actions et états actifs'],
    ['guidelines/colors-secondary.card.html',700,150,'Secondary · jaune citron','Marquage, jamais une action'],
    ['guidelines/colors-categories-pastel.card.html',700,150,'Teintes catégorie · pastel','Texte foncé obligatoire'],
    ['guidelines/colors-categories-light.card.html',700,150,'Teintes catégorie · light','Fonds très pâles pour les listes denses'],
    ['guidelines/colors-categories-vivid.card.html',700,150,'Teintes catégorie · vivid','Texte blanc, 4,5:1 sur blanc'],
    ['guidelines/colors-badges-in-use.card.html',700,150,'Badges · trois niveaux','pastel / light / vivid, même teinte'],
    ['guidelines/colors-hairlines.card.html',700,150,'Traits','Deux hairlines 0,5px, pas de bordure opaque'],
  ]},
  { id:'typo', icon:'typography', title:'Typographie', intro:'Sora ExtraBold pour les titres, Quicksand pour tout le reste.', cards:[
    ['guidelines/type-1-display.card.html',700,150,'Sora ExtraBold · titres','Titres d’écran 28px et de section 20px'],
    ['guidelines/type-2-text.card.html',700,150,'Quicksand · texte','400 / 500 / 600 / 700'],
    ['guidelines/type-3-scale.card.html',700,230,'Échelle mobile','Les cinq tailles réellement utilisées'],
    ['guidelines/type-4-eyebrow.card.html',700,150,'Surtitres & micro','Capitales espacées et libellés de tab bar'],
  ]},
  { id:'espacements', icon:'ruler-measure', title:'Espacements & rayons', intro:'Valeurs réellement employées, à copier telles quelles.', cards:[
    ['guidelines/spacing-scale.card.html',700,150,'Échelle d’espacement','2 → 48px'],
    ['guidelines/spacing-in-use.card.html',700,230,'Espacement en usage','Gutter 16px, padding carte 20px, gap grille 12px'],
    ['guidelines/spacing-controls.card.html',700,150,'Hauteurs de contrôle','48px boutons et champs, 56px FAB, 44px cible mini'],
    ['guidelines/radii.card.html',700,150,'Rayons','8 champs · 12 boutons · 14 cartes · 20 sheet · pill'],
  ]},
  { id:'marque', icon:'sparkles', title:'Marque', intro:'Icônes, ombres, mouvement, photos et nom.', cards:[
    ['guidelines/wordmark.card.html',700,180,'Nom de marque','Le nom se compose en Sora ExtraBold'],
    ['guidelines/icons.card.html',700,150,'Iconographie · Tabler','Outline, 20px, aucun autre jeu'],
    ['guidelines/icons-fallback-recette.card.html',700,320,'Icône de repli','Recette sans photo : une icône par catégorie'],
    ['guidelines/photo-treatment.card.html',700,260,'Traitement photo','3:4, dégradé de protection, trame placeholder'],
    ['guidelines/elevation.card.html',700,180,'Ombres','Système presque plat'],
    ['guidelines/motion.card.html',700,150,'Mouvement','120 / 180 / 260ms, une seule courbe'],
  ]},
  { id:'composants', icon:'components', title:'Composants', intro:'Les briques de l’interface et leurs variantes.', cards:[
    ['components/core/core.card.html',700,340,'Core','Button, Fab, Chip, Badge, Toggle, TextField, Icon'],
    ['components/patterns/patterns.card.html',700,420,'Patterns','RecipeCard, Card, TabBar, BottomSheet'],
  ]},
  { id:'app', icon:'device-mobile', title:'App', intro:'Maquette cliquable composée uniquement avec le système : navigue avec la barre du bas.', app:['ui_kits/cannelle-app/index.html',430,900,'Cannelle · app mobile','Accueil, Livre / Atelier, détail, menu, courses'] },
];

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardHTML([src, w, h, name, sub]) {
  return `<article class="card">
    <div class="card-head"><div><h3>${esc(name)}</h3><p>${esc(sub)}</p></div>
      <a class="open" href="${src}" target="_blank" rel="noopener" aria-label="Ouvrir ${esc(name)} seule"><i class="ti ti-arrow-up-right"></i></a></div>
    <div class="frame" data-w="${w}" data-h="${h}"><iframe src="${src}" title="${esc(name)}" scrolling="no"></iframe></div>
  </article>`;
}

const nav = document.getElementById('nav');
const main = document.getElementById('main');
nav.innerHTML = SECTIONS.map(s => `<li><a href="#${s.id}" data-id="${s.id}"><i class="ti ti-${s.icon}"></i>${s.title}</a></li>`).join('');
main.innerHTML = SECTIONS.map(s => {
  const body = s.app
    ? `<article class="card"><div class="card-head"><div><h3>${esc(s.app[3])}</h3><p>${esc(s.app[4])}</p></div>
        <a class="open" href="${s.app[0]}" target="_blank" rel="noopener" aria-label="Ouvrir la maquette seule"><i class="ti ti-arrow-up-right"></i></a></div>
        <div class="app-wrap"><div class="frame" data-w="${s.app[1]}" data-h="${s.app[2]}" data-fixed><iframe src="${s.app[0]}" title="${esc(s.app[3])}"></iframe></div></div></article>
       <p class="note"><strong>Modèle visuel, pas l’app réelle.</strong> Les écrans de Cannelle reprennent ces composants en HTML simple.</p>`
    : `<div class="cards">${s.cards.map(cardHTML).join('')}</div>`;
  return `<section id="${s.id}"><div class="sec-head"><h2><i class="ti ti-${s.icon}"></i>${s.title}</h2><p>${s.intro}</p></div>${body}</section>`;
}).join('');

// Mise à l'échelle des fiches pour qu'elles tiennent dans la largeur (téléphone compris)
const frames = [...document.querySelectorAll('.frame')];
function contentHeight(f) {
  if (f.hasAttribute('data-fixed')) return +f.dataset.h;
  try {
    const d = f.querySelector('iframe').contentDocument;
    const h = d && d.body ? Math.max(d.body.scrollHeight, d.documentElement.scrollHeight) : 0;
    if (h > 40) return h;
  } catch (e) {}
  return +f.dataset.h;
}
function fit(f) {
  const w = +f.dataset.w, ifr = f.querySelector('iframe');
  const scale = Math.min(1, f.clientWidth / w);
  const h = contentHeight(f);
  ifr.style.width = w + 'px';
  ifr.style.height = h + 'px';
  ifr.style.transform = `scale(${scale})`;
  f.style.height = Math.ceil(h * scale) + 'px';
}
frames.forEach(f => {
  fit(f);
  const ifr = f.querySelector('iframe');
  ifr.addEventListener('load', () => { fit(f); setTimeout(() => fit(f), 400); setTimeout(() => fit(f), 1500); });
});
new ResizeObserver(() => frames.forEach(fit)).observe(document.body);

// Chip active selon la section visible
const links = [...nav.querySelectorAll('a')];
const sections = [...document.querySelectorAll('section')];
let current = null;
function updateActive() {
  let id = sections[0].id;
  for (const s of sections) if (s.getBoundingClientRect().top <= 100) id = s.id;
  if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 4) id = sections[sections.length - 1].id;
  if (id === current) return;
  current = id;
  links.forEach(a => a.classList.toggle('on', a.dataset.id === id));
  const on = nav.querySelector('a.on');
  if (on) nav.scrollTo({ left: on.offsetLeft - 16, behavior: 'smooth' });
}
window.addEventListener('scroll', updateActive, { passive: true });
updateActive();

// Les fiches se chargent et changent de hauteur : on recale la cible après un clic
links.forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  const target = document.getElementById(a.dataset.id);
  const y = () => target.getBoundingClientRect().top + window.scrollY - 64;
  window.scrollTo({ top: y(), behavior: 'smooth' });
  const fix = () => { if (Math.abs(y() - window.scrollY) > 4) window.scrollTo({ top: y(), behavior: 'instant' }); updateActive(); };
  setTimeout(fix, 900); setTimeout(fix, 1800);
  history.replaceState(null, '', '#' + a.dataset.id);
}));
</script>
</body>
</html>
