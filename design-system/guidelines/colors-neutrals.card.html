<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--bg);color:var(--text)}*{box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.w{padding:18px 20px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-field);border:0.5px solid var(--border-subtle);height:56px}.n{font-size:11px;font-family:var(--font-mono);color:var(--text2);margin-top:5px;display:block}.t{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div><div class="sw" style="background:#FAFAF6"></div><span class="n">--bg<br>#FAFAF6</span></div><div><div class="sw" style="background:#ffffff"></div><span class="n">--surface<br>#ffffff</span></div><div><div class="sw" style="background:#F1F1E9"></div><span class="n">--surface2<br>#F1F1E9</span></div><div><div class="sw" style="background:#1a1a18"></div><span class="n">--text<br>#1a1a18</span></div><div><div class="sw" style="background:#656659"></div><span class="n">--text2<br>#656659</span></div><div><div class="sw" style="background:#767769"></div><span class="n">--text3<br>#767769 · 4,6:1</span></div></div></div></body></html>
