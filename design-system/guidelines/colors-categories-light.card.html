<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--bg);color:var(--text)}*{box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.w{padding:18px 20px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-field);border:0.5px solid var(--border-subtle);height:56px}.n{font-size:11px;font-family:var(--font-mono);color:var(--text2);margin-top:5px;display:block}.t{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div><div class="sw" style="background:#EDF4DD"></div><span class="n">--primary-light<br>#EDF4DD</span></div><div><div class="sw" style="background:#FDF7D5"></div><span class="n">--secondary-light<br>#FDF7D5</span></div><div><div class="sw" style="background:#FCE7EB"></div><span class="n">--fraise-light<br>#FCE7EB</span></div><div><div class="sw" style="background:#FDEBE0"></div><span class="n">--peche-light<br>#FDEBE0</span></div><div><div class="sw" style="background:#ECE7F8"></div><span class="n">--myrtille-light<br>#ECE7F8</span></div></div></div></body></html>
