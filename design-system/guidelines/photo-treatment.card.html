<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-text);background:var(--bg);color:var(--text)}*{box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.w{padding:18px 20px}.r{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--radius-field);border:0.5px solid var(--border-subtle);height:56px}.n{font-size:11px;font-family:var(--font-mono);color:var(--text2);margin-top:5px;display:block}.t{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3)}</style></head><body><div class="w" style="display:flex;gap:16px;align-items:flex-start">
 <div style="width:150px;border-radius:var(--radius-card);overflow:hidden;border:0.5px solid var(--border-subtle)"><div style="aspect-ratio:3/4;background:repeating-linear-gradient(135deg,#f0ece4 0 8px,#e8e3d9 8px 16px);display:flex;align-items:flex-end"><div style="width:100%;padding:28px 12px 10px;background:var(--overlay-scrim)"><div style="font-weight:700;font-size:14px;color:#fff">Tarte aux abricots</div><div style="font-size:11px;color:rgba(255,255,255,0.9);margin-top:4px">45 min</div></div></div></div>
 <div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="font-size:13.5px;line-height:1.5;color:var(--text2)">Photo <b>3:4</b> systématique. Le titre vit dans l'image, protégé par un dégradé noir 0 → 65% → 80% sur la moitié basse (<span style="font-family:var(--font-mono);font-size:11.5px">--overlay-scrim</span>) — jamais de capsule ni de bandeau plein.</div><div style="height:56px;border-radius:var(--radius-field);background:var(--overlay-scrim)"></div><span class="n">Sans photo : trame diagonale 8px #f0ece4 / #e8e3d9. Jamais de gris plat.</span></div></div></body></html>
